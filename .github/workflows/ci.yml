# Verification only. Does NOT deploy and needs no secrets.
# Fails until api/package-lock.json is committed, which is the intended reproducible-build gate.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Require lockfile
        run: test -f package-lock.json || (echo "api/package-lock.json is missing. Run 'npm install --package-lock-only' in api/ and commit it." && exit 1)
      - name: Clean install
        run: npm ci
      - name: Syntax check API sources
        run: for f in src/functions/*.js src/lib/*.js; do node --check "$f"; done
      - name: Tests
        run: npm test
